<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>"
    />
    <title>For Srishti</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      }

      body {
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a0a10 30%,
          #2d0a1a 60%,
          #1a0a15 100%
        );
        min-height: 100vh;
        position: relative;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Ambient background hearts */
      .ambient-heart {
        position: absolute;
        opacity: 0.03;
        pointer-events: none;
        animation: ambientFloat 20s infinite ease-in-out;
      }

      @keyframes ambientFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-30px) rotate(5deg);
        }
        50% {
          transform: translateY(-10px) rotate(-3deg);
        }
        75% {
          transform: translateY(-25px) rotate(3deg);
        }
      }

      /* Main content */
      .main-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffb6c1;
        font-size: clamp(1.5rem, 5vw, 3rem);
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 182, 193, 0.5),
          0 0 20px rgba(255, 182, 193, 0.3), 0 0 40px rgba(255, 182, 193, 0.2);
        animation: breathe 4s ease-in-out infinite;
        white-space: nowrap;
        z-index: 1;
        pointer-events: none;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.8;
          text-shadow: 0 0 10px rgba(255, 182, 193, 0.5),
            0 0 20px rgba(255, 182, 193, 0.3), 0 0 40px rgba(255, 182, 193, 0.2);
        }
        50% {
          opacity: 1;
          text-shadow: 0 0 15px rgba(255, 182, 193, 0.8),
            0 0 30px rgba(255, 182, 193, 0.5), 0 0 60px rgba(255, 182, 193, 0.3);
        }
      }

      /* Sparkle particles */
      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        animation: sparkleAnim 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
        will-change: transform, opacity;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      }

      @keyframes sparkleAnim {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0);
        }
      }

      /* Floating heart */
      .heart {
        position: absolute;
        width: 80px;
        height: 80px;
        pointer-events: none;
        animation: floatUp 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        z-index: 100;
        will-change: transform, opacity;
      }

      /* Heart shape using CSS */
      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        top: 0;
        width: 40px;
        height: 64px;
        border-radius: 40px 40px 0 0;
        background: linear-gradient(
          135deg,
          #ff6b9d 0%,
          #ff1493 50%,
          #dc143c 100%
        );
        box-shadow: 0 0 10px rgba(255, 20, 147, 0.6),
          inset 0 0 15px rgba(255, 255, 255, 0.3);
      }

      .heart::before {
        left: 40px;
        transform: rotate(-45deg);
        transform-origin: 0 100%;
      }

      .heart::after {
        left: 0;
        transform: rotate(45deg);
        transform-origin: 100% 100%;
      }

      /* Inner glow for glossy effect */
      .heart-inner {
        position: absolute;
        top: 15px;
        left: 15px;
        width: 50px;
        height: 50px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          transparent 50%
        );
        border-radius: 50%;
        z-index: 2;
      }

      /* Text inside heart */
      .heart-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 11px;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
        z-index: 3;
        letter-spacing: 1px;
      }

      @keyframes floatUp {
        0% {
          opacity: 0;
          transform: translateY(15px) rotate(0deg) scale(0);
        }
        8% {
          opacity: 1;
          transform: translateY(0) rotate(calc(var(--rotation) * 0.2))
            scale(1.2);
        }
        18% {
          opacity: 1;
          transform: translateY(-8px) rotate(calc(var(--rotation) * 0.5))
            scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-500px) rotate(calc(var(--rotation) * 0.5))
            scale(0.6);
        }
      }

      /* Subtle instruction text */
      .hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 182, 193, 0.3);
        font-size: 0.9rem;
        pointer-events: none;
        animation: hintFade 3s ease-in-out infinite;
      }

      @keyframes hintFade {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-text">This is my offering to you.. Srishti</div>
    <div class="hint">tap anywhere</div>

    <script>
      // Create ambient background hearts
      function createAmbientHearts() {
        const colors = ["#ff6b9d", "#ff1493", "#dc143c"];
        for (let i = 0; i < 15; i++) {
          const heart = document.createElement("div");
          heart.className = "ambient-heart";
          heart.style.left = Math.random() * 100 + "%";
          heart.style.top = Math.random() * 100 + "%";
          heart.style.width = 20 + Math.random() * 30 + "px";
          heart.style.height = heart.style.width;

          // Create heart shape
          const rotation = Math.random() * 360;
          heart.style.transform = `rotate(${rotation}deg)`;

          // Color
          heart.style.color = colors[Math.floor(Math.random() * colors.length)];
          heart.innerHTML = "♥";
          heart.style.fontSize = heart.style.width;
          heart.style.animationDelay = Math.random() * 20 + "s";
          heart.style.animationDuration = 15 + Math.random() * 10 + "s";

          document.body.appendChild(heart);
        }
      }

      // Create sparkles at position
      function createSparkles(x, y) {
        for (let i = 0; i < 8; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";

          const angle = (i / 8) * Math.PI * 2;
          const distance = 30 + Math.random() * 20;
          const sparkleX = x + Math.cos(angle) * distance;
          const sparkleY = y + Math.sin(angle) * distance;

          sparkle.style.left = sparkleX + "px";
          sparkle.style.top = sparkleY + "px";
          sparkle.style.animationDuration = 0.5 + Math.random() * 0.3 + "s";

          document.body.appendChild(sparkle);

          setTimeout(() => sparkle.remove(), 600);
        }
      }

      // Create floating heart at click position
      function createHeart(x, y) {
        const heart = document.createElement("div");
        heart.className = "heart";

        // Random rotation between -30 and 30 degrees
        const rotation = (Math.random() - 0.5) * 60;
        heart.style.setProperty("--rotation", rotation + "deg");

        // Position the heart (centered on click)
        heart.style.left = x - 40 + "px";
        heart.style.top = y - 40 + "px";

        // Add inner glow
        const inner = document.createElement("div");
        inner.className = "heart-inner";
        heart.appendChild(inner);

        // Add text
        const text = document.createElement("div");
        text.className = "heart-text";
        text.textContent = "Srishti";
        heart.appendChild(text);

        document.body.appendChild(heart);

        // Create sparkles
        createSparkles(x, y);

        // Remove after animation
        setTimeout(() => heart.remove(), 2800);
      }

      // Handle click/tap
      function handleClick(e) {
        // Prevent default to avoid double firing on some devices
        e.preventDefault();

        let x, y;

        if (e.type === "touchstart") {
          // For touch events
          const touch = e.touches[0];
          x = touch.clientX;
          y = touch.clientY;
        } else {
          // For mouse events
          x = e.clientX;
          y = e.clientY;
        }

        createHeart(x, y);
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        createAmbientHearts();

        // Support both click and touch
        document.addEventListener("click", handleClick, { passive: false });
        document.addEventListener("touchstart", handleClick, {
          passive: false,
        });
      });

      // Prevent context menu on long press (mobile)
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
