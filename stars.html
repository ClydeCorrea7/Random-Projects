<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Starfield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        overflow: hidden;
        background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 10px 20px;
        border-radius: 50px;
        display: flex;
        gap: 15px;
      }

      .control-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Press Start 2P", cursive;
        font-size: 10px;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
      }

      .title {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: white;
        font-family: "Press Start 2P", cursive;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .title h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        font-weight: 700;
      }

      .title p {
        font-size: 0.8rem;
        opacity: 0.8;
      }

      .explosion {
        position: absolute;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="title">
      <h1>Cosmic Connections</h1>
      <p>Hover to connect stars | Click to create explosions</p>
    </div>

    <div class="controls">
      <button class="control-btn" id="addStars">Add Stars</button>
      <button class="control-btn" id="clearStars">Clear Stars</button>
      <button class="control-btn" id="toggleLines">Toggle Lines</button>
      <button class="control-btn" id="changeColor">Change Color</button>
    </div>

    <canvas id="starfield"></canvas>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d");

        // Set canvas to full window size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Configuration
        const config = {
          starCount: 150,
          maxStars: 300,
          lineDistance: 200,
          starColors: ["#ffffff", "#4fc3f7", "#f06292", "#fff176", "#81c784"],
          currentColor: "#ffffff",
          showLines: true,
          speed: 1,
          explosionParticles: 20,
          explosionColors: [
            "#ff4081",
            "#ffeb3b",
            "#00bcd4",
            "#e91e63",
            "#3f51b5",
            "#9c27b0",
            "#ff9800",
            "#4caf50",
            "#2196f3",
            "#f44336",
            "#00ff00",
            "#ff00ff",
            "#00ffff",
            "#ff9900",
            "#6600cc",
            "#ff0066",
            "#33ccff",
            "#ffcc00",
            "#cc00ff",
            "#00ffcc",
          ],
        };

        // Stars array
        let stars = [];

        // Initialize stars
        function initStars(count) {
          for (let i = 0; i < count; i++) {
            stars.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * config.speed,
              vy: (Math.random() - 0.5) * config.speed,
              radius: Math.random() * 1.5 + 0.5,
              color:
                config.starColors[
                  Math.floor(Math.random() * config.starColors.length)
                ],
            });
          }
        }

        // Draw stars
        function draw() {
          // Clear canvas with semi-transparent black for trail effect
          ctx.fillStyle = "rgba(15, 12, 41, 0.2)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw stars
          stars.forEach((star) => {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.fill();

            // Add glow effect
            ctx.shadowColor = star.color;
            ctx.shadowBlur = 1;
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          // Draw connecting lines
          if (config.showLines) {
            for (let i = 0; i < stars.length; i++) {
              for (let j = i + 1; j < stars.length; j++) {
                const dx = stars[i].x - stars[j].x;
                const dy = stars[i].y - stars[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < config.lineDistance) {
                  const opacity = 1 - distance / config.lineDistance;
                  ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                  ctx.lineWidth = 0.5;
                  ctx.beginPath();
                  ctx.moveTo(stars[i].x, stars[i].y);
                  ctx.lineTo(stars[j].x, stars[j].y);
                  ctx.stroke();
                }
              }
            }
          }

          // Update star positions
          stars.forEach((star) => {
            star.x += star.vx;
            star.y += star.vy;

            // Bounce off edges
            if (star.x < 0 || star.x > canvas.width) star.vx = -star.vx;
            if (star.y < 0 || star.y > canvas.height) star.vy = -star.vy;
          });

          requestAnimationFrame(draw);
        }

        // Handle mouse hover to connect stars to mouse
        let mouseX = null;
        let mouseY = null;

        canvas.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;

          // Draw additional connections to mouse
          if (config.showLines) {
            stars.forEach((star) => {
              const dx = star.x - mouseX;
              const dy = star.y - mouseY;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < config.lineDistance * 1.5) {
                const opacity = 1 - distance / (config.lineDistance * 1.5);
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.5})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.stroke();

                // Increase star size when near mouse
                star.radius = Math.min(3, star.radius + 0.05);
              } else {
                // Return to original size
                star.radius = Math.max(star.radius - 0.02, 0.5);
              }
            });
          }
        });

        canvas.addEventListener("mouseout", () => {
          mouseX = null;
          mouseY = null;
        });

        // Handle click to create explosion
        canvas.addEventListener("click", (e) => {
          createExplosion(e.clientX, e.clientY);
        });

        // Create explosion effect
        function createExplosion(x, y) {
          const explosionParticles = [];
          for (let i = 0; i < config.explosionParticles; i++) {
            const color =
              config.explosionColors[
                Math.floor(Math.random() * config.explosionColors.length)
              ];
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 3 + 1;

            explosionParticles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              radius: Math.random() * 2 + 1,
              color:
                config.explosionColors[
                  Math.floor(Math.random() * config.explosionColors.length)
                ],
              life: 100, // Slightly longer life for better glow visibility
              decay: Math.random() * 0.4 + 0.4, // Slightly slower decay
            });
          }

          // Animate explosion
          function animateExplosion() {
            ctx.save();

            explosionParticles.forEach((particle, index) => {
              particle.x += particle.vx;
              particle.y += particle.vy;
              particle.life -= particle.decay;

              if (particle.life > 0) {
                ctx.beginPath();
                ctx.arc(
                  particle.x,
                  particle.y,
                  particle.radius,
                  0,
                  Math.PI * 10
                );
                ctx.fillStyle = `rgba(${hexToRgb(particle.color)}, ${
                  particle.life / 100
                })`;
                ctx.fill();

                // Enhanced glow effect
                ctx.shadowColor = particle.color;
                ctx.shadowBlur = 20 + particle.life / 5; // Dynamic glow that fades with life
                ctx.fill();
                // Secondary glow pass for more intensity
                ctx.shadowBlur = 15 + particle.life / 10;
                ctx.fill();
                ctx.shadowBlur = 0;
              } else {
                explosionParticles.splice(index, 1);
              }
            });

            ctx.restore();

            if (explosionParticles.length > 0) {
              requestAnimationFrame(animateExplosion);
            }
          }

          animateExplosion();
        }

        // Helper function to convert hex to rgb
        function hexToRgb(hex) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `${r}, ${g}, ${b}`;
        }

        // Control buttons
        document.getElementById("addStars").addEventListener("click", () => {
          if (stars.length < config.maxStars) {
            initStars(50);
          }
        });

        document.getElementById("clearStars").addEventListener("click", () => {
          stars = [];
          initStars(config.starCount);
        });

        document.getElementById("toggleLines").addEventListener("click", () => {
          config.showLines = !config.showLines;
        });

        document.getElementById("changeColor").addEventListener("click", () => {
          const newColor =
            config.starColors[
              Math.floor(Math.random() * config.starColors.length)
            ];
          config.currentColor = newColor;
          stars.forEach((star) => {
            star.color = newColor;
          });
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });

        // Initialize and start animation
        initStars(config.starCount);
        draw();
      });
    </script>
  </body>
</html>
